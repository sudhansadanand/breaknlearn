<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BreakNLearn · Little breaks. Big discoveries.</title><meta name="theme-color" content="#17132B"><style>:root{--night:#17132b;--purple:#5422a5;--blue:#31bff2;--yellow:#ffcc32;--green:#a8df68;--cream:#fff8eb;font-family:Nunito,Arial,system-ui;color:#fff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 88% 5%,#342055,transparent 44%),var(--night)}button,input{font:inherit}button{border:0;border-radius:20px;cursor:pointer;min-height:64px;padding:16px 22px;font-size:clamp(18px,1.6vw,27px);font-weight:850;transition:transform .16s,box-shadow .16s}button:focus-visible,input:focus-visible{outline:4px solid var(--yellow);outline-offset:4px;transform:scale(1.035);box-shadow:0 0 0 8px #ffcc3233}button.primary{background:var(--blue);color:#172142}button.secondary{background:#463465;color:white}button.soft{background:#fff8eb;color:#37205c}main{max-width:1600px;margin:auto;padding:clamp(16px,2.6vw,44px)}.mast{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:24px}.brand{height:clamp(78px,9vw,125px);object-fit:contain}.mini-logo{height:clamp(70px,7vw,106px);object-fit:contain}.tagline{font-size:clamp(16px,1.6vw,23px);color:#ead9ff}.eyebrow{color:var(--yellow);font-weight:900;letter-spacing:.1em;font-size:clamp(15px,1.2vw,20px);margin-bottom:12px}h1,h2,h3{font-family:Fredoka,Nunito,Arial,sans-serif;line-height:1.13;margin:0 0 16px}h1{font-size:clamp(38px,4.6vw,72px)}h2{font-size:clamp(29px,3vw,48px)}h3{font-size:clamp(23px,2.2vw,35px)}p{font-size:clamp(18px,1.8vw,28px);line-height:1.4;color:#e7e0f1;margin:7px 0 22px}.panel{background:linear-gradient(130deg,#352154,#211b3d);border:1px solid #67518c;border-radius:27px;padding:clamp(20px,3vw,44px);margin-bottom:24px}.profiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px;margin:30px 0}.profile{min-height:275px;border:2px solid #746095;background:linear-gradient(150deg,#463078,#272044);color:white;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}.profile .face{font-size:clamp(72px,8vw,130px)}.profile strong{font-size:clamp(28px,2.7vw,43px)}.profile .detail{color:#c9edf8;font-size:22px}.empty{border-style:dashed;background:#25213b}.field{display:flex;flex-direction:column;gap:9px;font-size:23px;font-weight:800}.field input{width:100%;padding:17px 20px;color:white;background:#2b2344;border:2px solid #77659b;border-radius:16px;min-height:68px;font-size:clamp(22px,2vw,30px)}.choices,.avatars,.actions{display:flex;flex-wrap:wrap;gap:13px;margin:17px 0 25px}.choice{border:2px solid #82729e;background:#31274d;color:white}.choice.selected{border-color:var(--yellow);background:#533789}.avatars button{font-size:clamp(32px,3vw,48px);min-height:87px;min-width:87px;padding:10px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin:23px 0}.tile{text-align:left;display:flex;flex-direction:column;justify-content:space-between;min-height:188px;color:white;border:2px solid #ffffff50;background:linear-gradient(135deg,var(--accent),#281942);box-shadow:0 12px 25px #07040f77}.tile .ico{font-size:clamp(44px,5.4vw,80px);text-align:right}.tile .sub{font-size:17px;color:#dfd6ed;font-weight:600}.tile.stub{opacity:.88}.backrow{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:22px}.crumb{font-size:clamp(18px,1.7vw,26px);color:#e1d8f1}.resume{display:flex;justify-content:space-between;align-items:center;gap:20px;border:2px solid #7357b9;border-radius:24px;padding:24px;background:#352353;margin:20px 0 32px}.resume h3{margin:0}.progress{width:100%;height:14px;background:#5d4f74;border-radius:15px;overflow:hidden;margin:14px 0}.progress>div{height:100%;background:linear-gradient(90deg,var(--blue),var(--yellow));transition:width .3s}.lesson-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.presentation{min-height:58vh;display:grid;grid-template-columns:1.03fr 1fr;gap:clamp(20px,4vw,70px);align-items:center;animation:fade .4s ease}.objects{min-height:330px;background:linear-gradient(140deg,#fff8eb,#f4e0ff);border-radius:26px;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px;padding:24px}.group{font-size:clamp(18px,2.55vw,41px);padding:9px;background:#fff;border-radius:16px;box-shadow:0 7px 14px #3e195124;white-space:nowrap}.group.dense{font-size:clamp(14px,1.7vw,25px);padding:6px}.formula{font:900 clamp(54px,6vw,100px) Fredoka,Nunito,Arial;color:var(--yellow)}.overlay{position:fixed;bottom:clamp(16px,3vw,43px);left:50%;transform:translateX(-50%);display:flex;justify-content:center;flex-wrap:wrap;gap:10px;max-width:94vw;width:max-content;padding:14px;background:#21173bea;border:2px solid #9078bd;border-radius:23px;box-shadow:0 12px 25px #0008;opacity:0;pointer-events:none;z-index:10;transition:opacity .2s}.overlay.shown,.overlay:focus-within{opacity:1;pointer-events:auto}.overlay button{font-size:clamp(16px,1.4vw,23px)}.quiz-answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.quiz-answers button{font-size:clamp(28px,3vw,48px);background:#443564;color:white}.quiz-answers button.correct{background:#316946}.quiz-answers button.wrong{background:#92425c}.center{text-align:center}.mascot{width:clamp(150px,20vw,280px)}.hint{font-size:18px;color:#b9acce}.notice{font-size:20px;color:#e8d9fb}.footer{color:#b8a9cc;font-size:16px}.table-card{min-height:180px}.table-card .ico{font-weight:900;color:#ffdf70;font-size:clamp(35px,4vw,66px)}@keyframes fade{from{opacity:.35;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@media(max-width:980px){.presentation{grid-template-columns:1fr}.objects{min-height:230px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){.grid,.profiles{grid-template-columns:1fr}.resume{flex-direction:column;align-items:stretch}.mast{align-items:flex-start}.profile{min-height:210px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}</style></head><body><main><div id="app"><div class="panel"><h1>BreakNLearn</h1><p>Opening your learning adventure…</p><button onclick="location.reload()">Retry</button></div></div></main><audio id="music" src="/music.wav" preload="auto" loop playsinline></audio><script src="/app.js?v=__BUILD_ID__"></script></body></html>
